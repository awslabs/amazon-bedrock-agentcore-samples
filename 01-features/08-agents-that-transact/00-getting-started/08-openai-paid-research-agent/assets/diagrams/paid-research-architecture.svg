<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Three-agent budget-bounded research sequence</title>
  <desc id="desc">A research lead delegates public research, passes one material gap to a premium evidence analyst, and retains the final answer. Only the premium analyst can use the application-bound x402 tool, while AgentCore Payments checks the budget and obtains delegated wallet signing.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#30343B"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0E8F72"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#E88B00"/>
    </marker>
    <style>
      .researcher{fill:#F4F2FA;stroke:#756B8A;stroke-width:2}
      .lead{fill:#E9F8F3;stroke:#0E8F72;stroke-width:2}
      .public{fill:#EAF4FF;stroke:#3A7FC4;stroke-width:2}
      .premium{fill:#EFECFF;stroke:#7C5CE5;stroke-width:2}
      .source{fill:#F7F5FC;stroke:#756B8A;stroke-width:2}
      .aws{fill:#FFF3D9;stroke:#E88B00;stroke-width:2}
      .participant-text{font:600 16px Arial,Helvetica,sans-serif;fill:#16181D;letter-spacing:0}
      .lane-neutral{stroke:#A29AAC;stroke-width:2}
      .lane-lead{stroke:#0E8F72;stroke-width:2}
      .lane-public{stroke:#3A7FC4;stroke-width:2}
      .lane-premium{stroke:#7C5CE5;stroke-width:2}
      .lane-aws{stroke:#E88B00;stroke-width:2}
      .message{stroke:#30343B;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .return{stroke:#30343B;stroke-width:2;stroke-dasharray:6 6;fill:none;marker-end:url(#arrow)}
      .synthesis{stroke:#0E8F72;stroke-width:2.5;fill:none;marker-end:url(#arrow-green)}
      .payment{stroke:#E88B00;stroke-width:2;fill:none;marker-end:url(#arrow-orange)}
      .label-bg{fill:#FFFFFF}
      .message-text{font:500 14px Arial,Helvetica,sans-serif;fill:#30343B;letter-spacing:0}
      .phase{font:700 12px Arial,Helvetica,sans-serif;fill:#FFFFFF;letter-spacing:.7px}
      .note{font:600 13px Arial,Helvetica,sans-serif;fill:#665E78;letter-spacing:.6px}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <g>
    <rect x="20" y="22" width="190" height="78" rx="6" class="researcher"/>
    <text x="115" y="67" text-anchor="middle" class="participant-text">Researcher</text>
    <line x1="115" y1="100" x2="115" y2="835" class="lane-neutral"/>

    <rect x="240" y="22" width="190" height="78" rx="6" class="lead"/>
    <text x="335" y="56" text-anchor="middle" class="participant-text">Research lead</text>
    <text x="335" y="79" text-anchor="middle" class="participant-text">SYNTHESIZE</text>
    <line x1="335" y1="100" x2="335" y2="835" class="lane-lead"/>

    <rect x="460" y="22" width="190" height="78" rx="6" class="public"/>
    <text x="555" y="56" text-anchor="middle" class="participant-text">Public evidence</text>
    <text x="555" y="79" text-anchor="middle" class="participant-text">SEARCH</text>
    <line x1="555" y1="100" x2="555" y2="835" class="lane-public"/>

    <rect x="680" y="22" width="190" height="78" rx="6" class="premium"/>
    <text x="775" y="56" text-anchor="middle" class="participant-text">Premium evidence</text>
    <text x="775" y="79" text-anchor="middle" class="participant-text">ACQUIRE</text>
    <line x1="775" y1="100" x2="775" y2="835" class="lane-premium"/>

    <rect x="900" y="22" width="190" height="78" rx="6" class="source"/>
    <text x="995" y="56" text-anchor="middle" class="participant-text">Paid data source</text>
    <text x="995" y="79" text-anchor="middle" class="participant-text">EXCHANGE</text>
    <line x1="995" y1="100" x2="995" y2="835" class="lane-neutral"/>

    <rect x="1120" y="22" width="190" height="78" rx="6" class="aws"/>
    <text x="1215" y="56" text-anchor="middle" class="participant-text">AgentCore</text>
    <text x="1215" y="79" text-anchor="middle" class="participant-text">ENFORCE</text>
    <line x1="1215" y1="100" x2="1215" y2="835" class="lane-aws"/>

    <rect x="1340" y="22" width="190" height="78" rx="6" class="aws"/>
    <text x="1435" y="56" text-anchor="middle" class="participant-text">Delegated wallet</text>
    <text x="1435" y="79" text-anchor="middle" class="participant-text">SIGN</text>
    <line x1="1435" y1="100" x2="1435" y2="835" class="lane-aws"/>
  </g>

  <rect x="257" y="116" width="156" height="25" rx="4" fill="#0E8F72"/>
  <text x="335" y="133" text-anchor="middle" class="phase">MANAGER PATTERN</text>

  <text x="225" y="162" text-anchor="middle" class="message-text">research question</text>
  <path d="M115 170H335" class="message"/>

  <text x="445" y="202" text-anchor="middle" class="message-text">delegate public research</text>
  <path d="M335 210H555" class="message"/>

  <text x="602" y="238" class="message-text">search + cite</text>
  <path d="M555 246H635V274H570" class="message"/>

  <text x="445" y="296" text-anchor="middle" class="message-text">evidence + residual gap</text>
  <path d="M555 304H335" class="return"/>

  <rect x="463" y="319" width="184" height="23" rx="3" class="label-bg"/>
  <text x="555" y="337" text-anchor="middle" class="message-text">delegate one material gap</text>
  <path d="M335 345H775" class="message"/>

  <text x="885" y="377" text-anchor="middle" class="message-text">bound HTTPS GET</text>
  <path d="M775 385H995" class="message"/>

  <text x="885" y="417" text-anchor="middle" class="message-text">402 Payment Required</text>
  <path d="M995 425H775" class="return"/>

  <rect x="907" y="439" width="176" height="23" rx="3" class="label-bg"/>
  <text x="995" y="457" text-anchor="middle" class="message-text">generate payment header</text>
  <path d="M775 465H1215" class="payment"/>

  <text x="1263" y="497" class="message-text">budget + TTL check</text>
  <path d="M1215 505H1295V533H1230" class="message"/>

  <text x="1325" y="555" text-anchor="middle" class="message-text">delegated signing</text>
  <path d="M1215 563H1435" class="payment"/>

  <text x="1325" y="595" text-anchor="middle" class="message-text">payment proof</text>
  <path d="M1435 603H1215" class="return"/>

  <rect x="918" y="617" width="154" height="23" rx="3" class="label-bg"/>
  <text x="995" y="635" text-anchor="middle" class="message-text">version-aware header</text>
  <path d="M1215 643H775" class="return"/>

  <text x="885" y="675" text-anchor="middle" class="message-text">retry with proof</text>
  <path d="M775 683H995" class="payment"/>

  <text x="885" y="715" text-anchor="middle" class="message-text">premium evidence</text>
  <path d="M995 723H775" class="return"/>

  <rect x="425" y="737" width="260" height="23" rx="3" class="label-bg"/>
  <text x="555" y="755" text-anchor="middle" class="message-text">evidence + payment outcome + budget</text>
  <path d="M775 763H335" class="return"/>

  <text x="225" y="795" text-anchor="middle" class="message-text">cited brief + paid-data ledger</text>
  <path d="M335 807H115" class="synthesis"/>

  <rect x="445" y="852" width="710" height="30" rx="4" fill="#F7F5FC"/>
  <text x="800" y="872" text-anchor="middle" class="note">ONLY THE PREMIUM SPECIALIST CAN ENTER THE PAYMENT FLOW</text>
</svg>
