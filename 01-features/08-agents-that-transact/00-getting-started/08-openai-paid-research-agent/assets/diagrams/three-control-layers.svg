<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Three control layers for a specialist purchase</title>
  <desc id="desc">A premium evidence analyst proposes a purchase, application policy permits an approved request, and AgentCore Payments enforces budget and expiry before a paid source returns evidence. A payment denial returns a bounded answer to the research lead instead.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#30343B"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0E8F72"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#D14343"/>
    </marker>
    <style>
      .participant{fill:#EFECFF;stroke:#8B6CEB;stroke-width:2}
      .participant-accent{fill:#FFF3D9;stroke:#E88B00;stroke-width:2}
      .participant-text{font:600 18px Arial,Helvetica,sans-serif;fill:#16181D;letter-spacing:0}
      .lane{stroke:#8B6CEB;stroke-width:2}
      .lane-accent{stroke:#E88B00;stroke-width:2}
      .message{stroke:#30343B;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .return{stroke:#30343B;stroke-width:2;stroke-dasharray:6 6;fill:none;marker-end:url(#arrow)}
      .success{stroke:#0E8F72;stroke-width:2;fill:none;marker-end:url(#arrow-green)}
      .denial{stroke:#D14343;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow-red)}
      .label-bg{fill:#FFFFFF}
      .label-bg-success{fill:#F0FAF7}
      .label-bg-denial{fill:#FFF3F3}
      .message-text{font:500 16px Arial,Helvetica,sans-serif;fill:#30343B;letter-spacing:0}
      .phase{font:700 13px Arial,Helvetica,sans-serif;letter-spacing:1px}
      .note{font:500 14px Arial,Helvetica,sans-serif;fill:#665E78;letter-spacing:0}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Participants -->
  <g>
    <rect x="55" y="24" width="260" height="76" rx="6" class="participant"/>
    <text x="185" y="58" text-anchor="middle" class="participant-text">Premium analyst</text>
    <text x="185" y="80" text-anchor="middle" class="participant-text">PROPOSE</text>
    <line x1="185" y1="100" x2="185" y2="800" class="lane"/>

    <rect x="370" y="24" width="260" height="76" rx="6" class="participant"/>
    <text x="500" y="58" text-anchor="middle" class="participant-text">Application policy</text>
    <text x="500" y="80" text-anchor="middle" class="participant-text">PERMIT</text>
    <line x1="500" y1="100" x2="500" y2="800" class="lane"/>

    <rect x="685" y="24" width="260" height="76" rx="6" class="participant"/>
    <text x="815" y="58" text-anchor="middle" class="participant-text">Paid data source</text>
    <text x="815" y="80" text-anchor="middle" class="participant-text">EXCHANGE</text>
    <line x1="815" y1="100" x2="815" y2="800" class="lane"/>

    <rect x="1000" y="24" width="260" height="76" rx="6" class="participant-accent"/>
    <text x="1130" y="58" text-anchor="middle" class="participant-text">AgentCore Payments</text>
    <text x="1130" y="80" text-anchor="middle" class="participant-text">ENFORCE</text>
    <line x1="1130" y1="100" x2="1130" y2="800" class="lane-accent"/>

    <rect x="1315" y="24" width="230" height="76" rx="6" class="participant-accent"/>
    <text x="1430" y="58" text-anchor="middle" class="participant-text">Wallet provider</text>
    <text x="1430" y="80" text-anchor="middle" class="participant-text">SIGN</text>
    <line x1="1430" y1="100" x2="1430" y2="800" class="lane-accent"/>
  </g>

  <!-- Propose and permit -->
  <text x="343" y="146" text-anchor="middle" class="message-text">propose exact premium source</text>
  <path d="M185 154H500" class="message"/>

  <text x="555" y="189" class="message-text">HTTPS + host + DNS checks</text>
  <path d="M500 197H610V229H515" class="message"/>

  <text x="658" y="258" text-anchor="middle" class="message-text">approved GET</text>
  <path d="M500 266H815" class="message"/>

  <text x="658" y="301" text-anchor="middle" class="message-text">402 + payment requirements</text>
  <path d="M815 309H500" class="return"/>

  <!-- Enforce -->
  <rect x="748" y="324" width="134" height="26" rx="3" class="label-bg"/>
  <text x="815" y="344" text-anchor="middle" class="message-text">process payment</text>
  <path d="M500 352H1130" class="message"/>

  <text x="1185" y="387" class="message-text">budget + TTL + atomic reserve</text>
  <path d="M1130 395H1240V427H1145" class="message"/>

  <text x="1280" y="456" text-anchor="middle" class="message-text">delegated signing</text>
  <path d="M1130 464H1430" class="message"/>

  <text x="1280" y="499" text-anchor="middle" class="message-text">payment proof</text>
  <path d="M1430 507H1130" class="return"/>

  <!-- Allowed branch -->
  <rect x="34" y="536" width="1532" height="150" rx="4" fill="#F0FAF7" stroke="#A8DCCE"/>
  <rect x="50" y="552" width="88" height="28" rx="4" fill="#0E8F72"/>
  <text x="94" y="571" text-anchor="middle" class="phase" fill="#FFFFFF">ALLOWED</text>

  <rect x="702" y="550" width="226" height="26" rx="3" class="label-bg-success"/>
  <text x="815" y="570" text-anchor="middle" class="message-text">version-aware payment header</text>
  <path d="M1130 578H500" class="success"/>

  <text x="658" y="613" text-anchor="middle" class="message-text">retry with proof</text>
  <path d="M500 621H815" class="success"/>

  <rect x="361" y="636" width="278" height="26" rx="3" class="label-bg-success"/>
  <text x="500" y="656" text-anchor="middle" class="message-text">premium evidence + payment metadata</text>
  <path d="M815 664H185" class="success"/>

  <!-- Denied branch -->
  <rect x="34" y="704" width="1532" height="96" rx="4" fill="#FFF3F3" stroke="#EAB0B0"/>
  <rect x="50" y="720" width="84" height="28" rx="4" fill="#D14343"/>
  <text x="92" y="739" text-anchor="middle" class="phase" fill="#FFFFFF">DENIED</text>

  <rect x="692" y="715" width="246" height="26" rx="3" class="label-bg-denial"/>
  <text x="815" y="735" text-anchor="middle" class="message-text">budget or session limit exceeded</text>
  <path d="M1130 743H500" class="denial"/>

  <text x="343" y="778" text-anchor="middle" class="message-text">bounded result + disclosed evidence gap</text>
  <path d="M500 786H185" class="denial"/>

  <rect x="520" y="844" width="560" height="32" rx="4" fill="#F7F5FC"/>
  <text x="800" y="865" text-anchor="middle" class="note">The specialist proposes. Deterministic controls permit or deny.</text>
</svg>
