[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcore-openai-paid-research"
version = "0.1.0"
description = "Budget-bounded multi-agent research with OpenAI Agents SDK and AgentCore Payments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aws-bedrock-token-generator>=1.1.0",
  "bedrock-agentcore>=1.18.0",
  "httpx>=0.27.0",
  "openai-agents>=0.19.1",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29.0",
  "nbclient>=0.10.0",
  "nbformat>=5.10.0",
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[project.scripts]
paid-research = "paid_research.agent:main"
paid-research-e2e = "paid_research.e2e:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
