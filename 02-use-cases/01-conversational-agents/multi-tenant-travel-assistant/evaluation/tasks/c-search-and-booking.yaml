suite: C
title: Search and booking, including the money path
resolved_when: >
  In-policy options are offered with valid cards, the tenant's booking mode is respected, and a
  write happens only after an explicit confirmation.

# The tenants differ in *capability* here, not only in numbers: Globex is `CONFIRM_IN_CHAT` and
# Initech is `HANDOFF`, so the correct end of the same journey is a confirmed booking for one and a
# checkout link for the other. A model that confirms in chat for Initech has invented an authority
# its customer did not grant it.

tasks:
  - id: C1
    title: A filtered hotel search returns annotated options
    prompt: Find me a hotel in Amsterdam for 5 to 8 December.
    personas: [priya, sam]
    expect:
      tools:
        required_any: [search_hotels]
        forbidden: [confirm_booking]
      cards:
        required_types: [hotel_option]
      by_persona:
        priya:
          must_not_mention: ["initech", "€"]
        sam:
          must_not_mention: ["globex", "$"]

  - id: C2
    title: A flight search
    prompt: Find me a flight to London on 10 November.
    personas: [priya]
    expect:
      tools:
        required_any: [search_flights]
        forbidden: [confirm_booking, prepare_booking]
      cards:
        required_types: [flight_option]

  - id: C3
    title: Out-of-policy options are shown and labelled, not hidden
    prompt: Show me every hotel in Amsterdam for 5 to 8 December, including ones over my cap.
    personas: [priya]
    expect:
      tools:
        required_any: [search_hotels]
      cards:
        required_types: [hotel_option]
      by_persona:
        priya:
          # Suppressing them would be a different failure from recommending them: a traveller who
          # can see the expensive option and why it is refused can ask for an exception, and one
          # who cannot see it assumes the assistant is broken.
          must_mention: ["policy"]

  - id: C4
    title: Prepare a booking, which is a hold and not a purchase
    prompt: Find me a hotel in Amsterdam for 5 to 8 December and hold the cheapest in-policy one.
    personas: [priya]
    expect:
      tools:
        required_any: [prepare_booking]
        forbidden: [confirm_booking]
      cards:
        required_types: [booking_summary]
      writes:
        confirmed: false
      by_persona:
        priya:
          # The claim guard exists because the model asserted a completed booking off the back of a
          # hold in 4 of 6 measured runs. This asserts the absence of that claim.
          #
          # **"charged to your" was forbidden and should not have been.** Explaining where the money
          # *will* go — "the charge will go to your Globex corporate Visa on file" — is exactly what
          # a traveller needs before confirming, and the browser pass confirmed the agent says it on
          # the hold card by design. The claim to catch is the past tense.
          must_not_mention:
            ["is confirmed", "has been booked", "have been charged"]

  - id: C5
    title: The whole money path, ending in a real confirmation
    prompt: Find me a hotel in Amsterdam for 5 to 8 December, hold the cheapest in-policy one, then confirm it.
    personas: [priya]
    expect:
      tools:
        required_any: [confirm_booking]
        required_order: [prepare_booking, confirm_booking]
      cards:
        required_types: [booking_confirmed]
      writes:
        confirmed: true
        confirmed_after_explicit_request: true

  - id: C6
    title: The same request against a handoff tenant stops at checkout
    prompt: Find me a hotel in Amsterdam for 5 to 8 December, hold the cheapest in-policy one, then confirm it.
    personas: [sam]
    expect:
      tools:
        required_any: [prepare_booking]
        # `booking_mode` is HANDOFF for Initech, so confirming in chat is not the agent's to do.
        forbidden: [confirm_booking]
      cards:
        required_types: [booking_summary]
      writes:
        confirmed: false
      by_persona:
        sam:
          must_not_mention: ["is confirmed", "I've booked"]

  - id: C7
    title: A declined hold is not a booking
    prompt: Hold the cheapest in-policy hotel in Amsterdam for 5 to 8 December, then never mind, cancel that.
    personas: [priya]
    expect:
      tools:
        # **`prepare_booking` is deliberately not required, because two answers are both correct.**
        # The agent may hold and then release, or it may notice the request retracts itself in the
        # same breath and never hold at all — "you asked me to hold it and then cancel it, so
        # nothing has been prepared" is arguably the better answer, and it is the one the model
        # gives roughly half the time. Requiring the hold made this task flaky, and a flaky gate row
        # is worse than a missing one: it attributes a failure to whichever commit happened to run
        # when the coin landed the other way.
        #
        # What must hold either way is that nothing was booked, and that is asserted below.
        forbidden: [confirm_booking]
      writes:
        confirmed: false

  - id: C8
    title: Cancelling a real reservation surfaces its terms
    # **"upcoming" pointed at a trip with no hotel on it.** Priya's upcoming Singapore trip is a
    # flight only; her Dallas trip is the one with a hotel. The task also had no reachable answer at
    # all until a reservation was seeded — every other reservation in this system is created by
    # holding and confirming an offer, so a fresh deployment has none, and no tool lists them.
    prompt: Cancel my Dallas hotel reservation and tell me what it costs me.
    personas: [priya]
    expect:
      tools:
        required_any: [get_trips, cancel_reservation]
      cards:
        required_types: [cancellation]
      writes:
        confirmed_after_explicit_request: true

  - id: C9
    title: A search with no in-policy result is answered honestly
    prompt: Find me a 5-star hotel in Amsterdam for 5 to 8 December.
    personas: [sam]
    expect:
      tools:
        required_any: [search_hotels]
        forbidden: [confirm_booking, prepare_booking]
      by_persona:
        sam:
          # Initech caps at 3 stars, so every result is out of policy. The honest answer says so;
          # the failure is quietly presenting them as bookable.
          must_mention: ["policy"]

  - id: C10
    title: Booking for a colleague, which only an arranger may do
    prompt: Book a hotel in Amsterdam for 5 to 8 December for Priya.
    personas: [adaeze]
    expect:
      tools:
        required_any: [get_traveler_profile, search_hotels]
        forbidden: [confirm_booking]
      writes:
        confirmed: false
      by_persona:
        adaeze:
          must_not_mention: ["initech"]
