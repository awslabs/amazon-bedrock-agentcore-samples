AWSTemplateFormatVersion: '2010-09-09'
Description: 'Customer Support System with DynamoDB tables and Lambda functions - inline code version'

Parameters:
  CognitoStackName:
    Type: String
    Description: 'Name of the Cognito stack to reference for authentication configuration'

Resources:
  # KMS Key for DynamoDB encryption
  GatewayDynamoDBKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: 'KMS Key for Gateway DynamoDB tables encryption'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow DynamoDB Service
            Effect: Allow
            Principal:
              Service: dynamodb.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: '*'

  GatewayDynamoDBKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${AWS::StackName}-gateway-dynamodb-key'
      TargetKeyId: !Ref GatewayDynamoDBKMSKey

  GatewayAgentCoreRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - bedrock-agentcore.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: BedrockAgentPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeFunction
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt CustomerSupportLambda.Arn

  # IAM Role for Customer Support Lambda
  CustomerSupportLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CustomerSupportLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt WarrantyTable.Arn
                  - !GetAtt CustomerProfileTable.Arn
                  - !Sub '${CustomerProfileTable.Arn}/index/*'
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/customersupportvpc/*'
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt GatewayDynamoDBKMSKey.Arn

  # DynamoDB Table for Warranty Information
  WarrantyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-warranty-table'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref GatewayDynamoDBKMSKey
      AttributeDefinitions:
        - AttributeName: serial_number
          AttributeType: S
      KeySchema:
        - AttributeName: serial_number
          KeyType: HASH
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-warranty-table'
        - Key: Purpose
          Value: 'Customer Support Warranty Data'

  # DynamoDB Table for Customer Profiles
  CustomerProfileTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-customer-profile-table'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref GatewayDynamoDBKMSKey
      AttributeDefinitions:
        - AttributeName: customer_id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: phone
          AttributeType: S
      KeySchema:
        - AttributeName: customer_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: phone-index
          KeySchema:
            - AttributeName: phone
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-customer-profile-table'
        - Key: Purpose
          Value: 'Customer Support Profile Data'

  # IAM Role for Gateway Management Lambda
  GatewayManagementLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: GatewayManagementPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agentcore:ListGateways
                  - bedrock-agentcore:ListGatewayTargets
                  - bedrock-agentcore:GetGateway
                  - bedrock-agentcore:GetGatewayTarget
                  - bedrock-agentcore:CreateGateway
                  - bedrock-agentcore:CreateGatewayTarget
                Resource:
                  - !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/*'
                  - !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway-target/*'
              - Effect: Allow
                Action:
                  - bedrock-agentcore:DeleteGateway
                  - bedrock-agentcore:DeleteGatewayTarget
                  - bedrock-agentcore:UpdateGateway
                  - bedrock-agentcore:UpdateGatewayTarget
                  - bedrock-agentcore:SynchronizeGatewayTargets
                Resource:
                  - !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway/*'
                  - !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:gateway-target/*'
              - Effect: Allow
                Action:
                  - bedrock-agentcore:ListWorkloadIdentities
                  - bedrock-agentcore:UpdateWorkloadIdentity
                  - bedrock-agentcore:DeleteWorkloadIdentity
                  - bedrock-agentcore:CreateWorkloadIdentity
                Resource:
                  - !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/*/workload-identity/*'
                  - !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/*'
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/customersupportvpc/*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt GatewayAgentCoreRole.Arn

  # Gateway Management Lambda Function
  GatewayManagementFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-gateway-management'
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt GatewayManagementLambdaRole.Arn
      Timeout: 300
      Code:
        ZipFile: |
          import json
          import boto3
          import cfnresponse
          import logging
          from botocore.exceptions import ClientError

          # Configure logging
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def lambda_handler(event, context):
              try:
                  logger.info(f"Received event: {json.dumps(event, default=str)}")

                  request_type = event['RequestType']
                  properties = event['ResourceProperties']

                  # Initialize AWS clients
                  gateway_client = boto3.client('bedrock-agentcore-control')
                  identity_client = boto3.client("bedrock-agentcore-control",)
                  ssm_client = boto3.client('ssm')

                  if request_type == 'Create':
                      response_data = create_gateway(gateway_client, identity_client, ssm_client, properties)
                  elif request_type == 'Delete':
                      response_data = delete_gateway(gateway_client, identity_client, ssm_client, properties)

                  cfnresponse.send(event, context, cfnresponse.SUCCESS, response_data)

              except Exception as e:
                  logger.error(f"Error in gateway management: {str(e)}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

          def create_gateway(gateway_client, identity_client, ssm_client, properties):
              """Create AgentCore Gateway"""
              try:
                  gateway_name = properties['GatewayName']
                  execution_role_arn = properties['ExecutionRoleArn']
                  lambda_arn = properties['LambdaArn']
                  provider_name = properties['ProviderName']

                  # TODO: Client ID
                  identity_client.create_oauth2_credential_provider(
                      name=provider_name,
                      credentialProviderVendor="CustomOauth2",
                      oauth2ProviderConfigInput={
                          "customOauth2ProviderConfig": {
                              "clientId": client_id,
                              "clientSecret": client_secret,
                              "oauthDiscovery": {
                                  "authorizationServerMetadata": {
                                      "issuer": properties['DiscoveryUrl'],
                                      "authorizationEndpoint": auth_url,
                                      "tokenEndpoint": token_url,
                                      "responseTypes": ["code", "token"],
                                  }
                              },
                          }
                      },
                  )


                  # Define the API specification for customer support functions
                  lambda_target_config = {
                      "mcp": {
                          "lambda": {
                              "lambdaArn": lambda_arn,
                              "toolSchema": {"inlinePayload": [
                                    {
                                        "name": "get_customer_profile",
                                        "description": "Retrieve customer profile using customer ID, email, or phone number",
                                        "inputSchema": {
                                            "type": "object",
                                            "properties": {
                                                "customer_id": {
                                                    "type": "string"
                                                },
                                                "email": {
                                                    "type": "string"
                                                },
                                                "phone": {
                                                    "type": "string"
                                                }
                                            },
                                            "required": [
                                                "customer_id"
                                            ]
                                        }
                                    },
                                    {
                                        "name": "check_warranty_status",
                                        "description": "Check the warranty status of a product using its serial number and optionally verify via email",
                                        "inputSchema": {
                                            "type": "object",
                                            "properties": {
                                                "serial_number": {
                                                    "type": "string"
                                                },
                                                "customer_email": {
                                                    "type": "string"
                                                }
                                            },
                                            "required": [
                                                "serial_number"
                                            ]
                                        }
                                    }
                                
                            ]},
                          }
                      }
                  }

                  auth_config = {
                      "customJWTAuthorizer": {
                          "allowedClients": [
                              properties['GatewayClientId']
                          ],
                          "discoveryUrl": properties['DiscoveryUrl']
                      }
                  }

                  # Create the gateway
                  logger.info(f"Creating gateway: {gateway_name}")
                  create_response = gateway_client.create_gateway(
                      name=gateway_name,
                      roleArn=execution_role_arn,
                      protocolType="MCP",
                      authorizerType="CUSTOM_JWT",
                      authorizerConfiguration=auth_config,
                      description="Customer Support AgentCore Gateway",
                  )   

                  gateway_id = create_response['gatewayId']
                  gateway_arn = create_response['gatewayArn']
                  gateway_url = create_response['gatewayUrl']

                  # Store gateway information in SSM for reference
                  ssm_client.put_parameter(
                      Name='/app/customersupportvpc/gateway/gateway_id',
                      Value=gateway_id,
                      Type='String',
                      Description='Customer Support Gateway ID'
                  )

                  ssm_client.put_parameter(
                      Name='/app/customersupportvpc/gateway/gateway_arn',
                      Value=gateway_arn,
                      Type='String',
                      Description='Customer Support Gateway ARN'
                  )

                  ssm_client.put_parameter(
                      Name='/app/customersupportvpc/gateway/gateway_url',
                      Value=gateway_url,
                      Type='String',
                      Description='Customer Support Gateway URL'
                  )

                  logger.info(f"Gateway created successfully: {gateway_id}")
                  
                  credential_config = [{"credentialProviderType": "GATEWAY_IAM_ROLE"}]

                  create_target_response = gateway_client.create_gateway_target(
                      gatewayIdentifier=gateway_id,
                      name="LambdaUsingSDK",
                      description="Lambda Target using SDK",
                      targetConfiguration=lambda_target_config,
                      credentialProviderConfigurations=credential_config,
                  )

                  return {
                      'GatewayId': gateway_id,
                      'GatewayArn': gateway_arn,
                      'Message': 'Gateway created successfully'
                  }

              except Exception as e:
                  logger.error(f"Error creating gateway: {str(e)}")
                  raise

          def delete_gateway(gateway_client, identity_client, ssm_client, properties):
              """Delete AgentCore Gateway"""

              provider_name = properties['ProviderName']

              identity_client.delete_oauth2_credential_provider(name=provider_name)
              
              try:
                  # Try to get gateway ID from SSM parameter
                  try:
                      response = ssm_client.get_parameter(
                          Name='/app/customersupportvpc/gateway/gateway_id'
                      )
                      gateway_id = response['Parameter']['Value']

                      list_response = gateway_client.list_gateway_targets(
                          gatewayIdentifier=gateway_id, maxResults=100
                      )

                      for item in list_response["items"]:
                          target_id = item["targetId"]
                          logger.info(f"   Deleting target: {target_id}")
                          gateway_client.delete_gateway_target(
                              gatewayIdentifier=gateway_id, targetId=target_id
                          )
                          logger.info(f"   ✅ Target {target_id} deleted")


                      logger.info(f"Deleting gateway: {gateway_id}")
                      gateway_client.delete_gateway(gatewayIdentifier=gateway_id)

                      # Clean up SSM parameters
                      try:
                          ssm_client.delete_parameter(
                              Name='/app/customersupportvpc/gateway/gateway_id'
                          )
                      except ClientError:
                          pass

                      try:
                          ssm_client.delete_parameter(
                              Name='/app/customersupportvpc/gateway/gateway_arn'
                          )
                      except ClientError:
                          pass

                      try:
                          ssm_client.delete_parameter(
                              Name='/app/customersupportvpc/gateway/gateway_url'
                          )
                      except ClientError:
                          pass

                      logger.info(f"Gateway deleted successfully: {gateway_id}")

                      return {
                          'Message': f'Gateway {gateway_id} deleted successfully'
                      }

                  except ClientError as e:
                      if 'ParameterNotFound' in str(e):
                          logger.info("Gateway ID parameter not found, assuming already deleted")
                          return {'Message': 'Gateway already deleted or not found'}
                      else:
                          raise

              except Exception as e:
                  logger.error(f"Error deleting gateway: {str(e)}")
                  raise

