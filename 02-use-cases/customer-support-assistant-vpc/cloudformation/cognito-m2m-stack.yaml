AWSTemplateFormatVersion: '2010-09-09'
Description: 'Cognito User Pool with M2M authentication for gateway and agent clients'

Resources:
  # Cognito User Pool for M2M Authentication
  M2MUserPool:
    Type: AWS::Cognito::UserPool
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: F78
            reason: "MFA not applicable for M2M authentication using client credentials flow"
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-m2m-pool'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: 'OFF'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags:
        Name: !Sub '${AWS::StackName}-m2m-pool'
        Purpose: 'Machine-to-Machine Authentication'

  # User Pool Domain for OAuth endpoints
  M2MUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub
        - 'agentcore-m2m-${AccountId}'
        - AccountId: !Ref AWS::AccountId
      UserPoolId: !Ref M2MUserPool

  # Resource Server for M2M scopes
  M2MResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref M2MUserPool
      Identifier: !Sub '${AWS::StackName}-resource-server'
      Name: !Sub '${AWS::StackName} Resource Server'
      Scopes:
        - ScopeName: 'read'
          ScopeDescription: 'Read access to resources'
        - ScopeName: 'write'
          ScopeDescription: 'Write access to resources'
        - ScopeName: 'gateway'
          ScopeDescription: 'Gateway-specific access'
        - ScopeName: 'agent'
          ScopeDescription: 'Agent-specific access'

  # Gateway Client for M2M Authentication
  GatewayClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: M2MResourceServer
    Properties:
      ClientName: 'gatewayclient'
      UserPoolId: !Ref M2MUserPool
      GenerateSecret: true
      ExplicitAuthFlows: []
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - !Sub '${AWS::StackName}-resource-server/read'
        - !Sub '${AWS::StackName}-resource-server/gateway'
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      PreventUserExistenceErrors: 'ENABLED'

  # Agent Client for M2M Authentication
  AgentClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: M2MResourceServer
    Properties:
      ClientName: 'agentclient'
      UserPoolId: !Ref M2MUserPool
      GenerateSecret: true
      ExplicitAuthFlows: []
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - !Sub '${AWS::StackName}-resource-server/read'
        - !Sub '${AWS::StackName}-resource-server/write'
        - !Sub '${AWS::StackName}-resource-server/agent'
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      PreventUserExistenceErrors: 'ENABLED'

  # MCP Client for M2M Authentication
  MCPClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: M2MResourceServer
    Properties:
      ClientName: 'mcpclient'
      UserPoolId: !Ref M2MUserPool
      GenerateSecret: true
      ExplicitAuthFlows: []
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - !Sub '${AWS::StackName}-resource-server/read'
        - !Sub '${AWS::StackName}-resource-server/write'
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      PreventUserExistenceErrors: 'ENABLED'

  # Secrets Manager Secrets for Client Configuration
  GatewayClientSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/gateway/client-config'
      Description: 'Gateway Client configuration for M2M authentication'
      KmsKeyId: !Ref SecretsManagerKMSKey
      SecretString: !Sub |
        {
          "client_id": "${GatewayClient}",
          "user_pool_id": "${M2MUserPool}",
          "token_endpoint": "https://${M2MUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/token",
          "cognito_discovery_url": "https://cognito-idp.${AWS::Region}.amazonaws.com/${M2MUserPool}/.well-known/openid-configuration"
        }
      Tags:
        - Key: Application
          Value: CustomerSupport
        - Key: Purpose
          Value: M2M-Authentication

  AgentClientSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/agent/client-config'
      Description: 'Agent Client configuration for M2M authentication'
      KmsKeyId: !Ref SecretsManagerKMSKey
      SecretString: !Sub |
        {
          "client_id": "${AgentClient}",
          "user_pool_id": "${M2MUserPool}",
          "token_endpoint": "https://${M2MUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/token",
          "cognito_discovery_url": "https://cognito-idp.${AWS::Region}.amazonaws.com/${M2MUserPool}/.well-known/openid-configuration"
        }
      Tags:
        - Key: Application
          Value: CustomerSupport
        - Key: Purpose
          Value: M2M-Authentication

  MCPClientSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/mcp/client-config'
      Description: 'MCP Client configuration for M2M authentication'
      KmsKeyId: !Ref SecretsManagerKMSKey
      SecretString: !Sub |
        {
          "client_id": "${MCPClient}",
          "user_pool_id": "${M2MUserPool}",
          "token_endpoint": "https://${M2MUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/token",
          "cognito_discovery_url": "https://cognito-idp.${AWS::Region}.amazonaws.com/${M2MUserPool}/.well-known/openid-configuration"
        }
      Tags:
        - Key: Application
          Value: CustomerSupport
        - Key: Purpose
          Value: M2M-Authentication

  # KMS Key for Secrets Manager encryption
  SecretsManagerKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: 'KMS key for Cognito M2M secrets encryption'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow Secrets Manager access
            Effect: Allow
            Principal:
              Service: secretsmanager.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: '*'
      KeyUsage: ENCRYPT_DECRYPT
      KeySpec: SYMMETRIC_DEFAULT
      Tags:
        - Key: Application
          Value: CustomerSupport
        - Key: Purpose
          Value: M2M-Secrets-Encryption

  SecretsManagerKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${AWS::StackName}-secrets-manager-key'
      TargetKeyId: !Ref SecretsManagerKMSKey

  # IAM Role for Lambda function
  ClientSecretLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CognitoClientSecretAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:DescribeUserPoolClient
                Resource: !GetAtt M2MUserPool.Arn
              - Effect: Allow
                Action:
                  - secretsmanager:UpdateSecret
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref GatewayClientSecret
                  - !Ref AgentClientSecret
                  - !Ref MCPClientSecret
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt SecretsManagerKMSKey.Arn

  # Lambda function to retrieve client secrets
  ClientSecretLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-client-secret-handler'
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt ClientSecretLambdaRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import json
          import boto3
          import urllib3

          def lambda_handler(event, context):
              try:
                  print(f"Received event: {json.dumps(event)}")

                  request_type = event['RequestType']
                  if request_type == 'Delete':
                      send_response(event, context, 'SUCCESS', {})
                      return

                  # Get properties from the event
                  properties = event['ResourceProperties']
                  user_pool_id = properties['UserPoolId']
                  client_id = properties['ClientId']
                  secret_arn = properties['SecretArn']
                  client_type = properties['ClientType']

                  # Initialize boto3 clients
                  cognito_client = boto3.client('cognito-idp')
                  secrets_client = boto3.client('secretsmanager')

                  # Get client secret from Cognito
                  response = cognito_client.describe_user_pool_client(
                      UserPoolId=user_pool_id,
                      ClientId=client_id
                  )

                  client_secret = response['UserPoolClient']['ClientSecret']

                  # Get existing secret value
                  secret_response = secrets_client.get_secret_value(SecretId=secret_arn)
                  secret_data = json.loads(secret_response['SecretString'])

                  # Add client_secret to the existing data
                  secret_data['client_secret'] = client_secret

                  # Update the secret
                  secrets_client.update_secret(
                      SecretId=secret_arn,
                      SecretString=json.dumps(secret_data, indent=2)
                  )

                  print(f"Successfully updated {client_type} client secret")
                  send_response(event, context, 'SUCCESS', {'ClientSecretUpdated': 'true'})

              except Exception as e:
                  print(f"Error: {str(e)}")
                  send_response(event, context, 'FAILED', {'Error': str(e)})

          def send_response(event, context, response_status, response_data):
              response_body = {
                  'Status': response_status,
                  'Reason': f'See CloudWatch Log Stream: {context.log_stream_name}',
                  'PhysicalResourceId': context.log_stream_name,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': response_data
              }

              json_response_body = json.dumps(response_body)

              headers = {
                  'content-type': '',
                  'content-length': str(len(json_response_body))
              }

              http = urllib3.PoolManager()
              response = http.request('PUT', event['ResponseURL'], body=json_response_body, headers=headers)
              print(f"Response status: {response.status}")

  # Custom resource to update Gateway client secret
  GatewayClientSecretUpdater:
    Type: AWS::CloudFormation::CustomResource
    DependsOn: GatewayClientSecret
    Properties:
      ServiceToken: !GetAtt ClientSecretLambda.Arn
      UserPoolId: !Ref M2MUserPool
      ClientId: !Ref GatewayClient
      SecretArn: !Ref GatewayClientSecret
      ClientType: Gateway

  # Custom resource to update Agent client secret
  AgentClientSecretUpdater:
    Type: AWS::CloudFormation::CustomResource
    DependsOn: AgentClientSecret
    Properties:
      ServiceToken: !GetAtt ClientSecretLambda.Arn
      UserPoolId: !Ref M2MUserPool
      ClientId: !Ref AgentClient
      SecretArn: !Ref AgentClientSecret
      ClientType: Agent

  # Custom resource to update MCP client secret
  MCPClientSecretUpdater:
    Type: AWS::CloudFormation::CustomResource
    DependsOn: MCPClientSecret
    Properties:
      ServiceToken: !GetAtt ClientSecretLambda.Arn
      UserPoolId: !Ref M2MUserPool
      ClientId: !Ref MCPClient
      SecretArn: !Ref MCPClientSecret
      ClientType: MCP

Outputs:
  UserPoolId:
    Description: 'Cognito User Pool ID'
    Value: !Ref M2MUserPool
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolId'

  UserPoolArn:
    Description: 'Cognito User Pool ARN'
    Value: !GetAtt M2MUserPool.Arn
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolArn'

  UserPoolDomain:
    Description: 'Cognito User Pool Domain'
    Value: !Sub '${M2MUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolDomain'

  ResourceServerIdentifier:
    Description: 'Resource Server Identifier'
    Value: !Ref M2MResourceServer
    Export:
      Name: !Sub '${AWS::StackName}-ResourceServerIdentifier'

  GatewayClientId:
    Description: 'Gateway Client ID'
    Value: !Ref GatewayClient
    Export:
      Name: !Sub '${AWS::StackName}-GatewayClientId'

  AgentClientId:
    Description: 'Agent Client ID'
    Value: !Ref AgentClient
    Export:
      Name: !Sub '${AWS::StackName}-AgentClientId'

  MCPClientId:
    Description: 'MCP Client ID'
    Value: !Ref MCPClient
    Export:
      Name: !Sub '${AWS::StackName}-MCPClientId'

  TokenEndpoint:
    Description: 'OAuth 2.0 Token Endpoint'
    Value: !Sub 'https://${M2MUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/token'
    Export:
      Name: !Sub '${AWS::StackName}-TokenEndpoint'

  GatewayScopes:
    Description: 'Available scopes for Gateway Client'
    Value: !Sub '${AWS::StackName}-resource-server/read ${AWS::StackName}-resource-server/gateway'
    Export:
      Name: !Sub '${AWS::StackName}-GatewayScopes'

  AgentScopes:
    Description: 'Available scopes for Agent Client'
    Value: !Sub '${AWS::StackName}-resource-server/read ${AWS::StackName}-resource-server/write ${AWS::StackName}-resource-server/agent'
    Export:
      Name: !Sub '${AWS::StackName}-AgentScopes'

  MCPScopes:
    Description: 'Available scopes for MCP Client'
    Value: !Sub '${AWS::StackName}-resource-server/read ${AWS::StackName}-resource-server/write'
    Export:
      Name: !Sub '${AWS::StackName}-MCPScopes'

  GatewayClientSecret:
    Description: 'Gateway Client Secret ARN for accessing client configuration'
    Value: !Ref GatewayClientSecret
    Export:
      Name: !Sub '${AWS::StackName}-GatewayClientSecret'

  AgentClientSecret:
    Description: 'Agent Client Secret ARN for accessing client configuration'
    Value: !Ref AgentClientSecret
    Export:
      Name: !Sub '${AWS::StackName}-AgentClientSecret'

  MCPClientSecret:
    Description: 'MCP Client Secret ARN for accessing client configuration'
    Value: !Ref MCPClientSecret
    Export:
      Name: !Sub '${AWS::StackName}-MCPClientSecret'

  SecretsManagerKMSKeyArn:
    Description: 'KMS Key ARN for Secrets Manager encryption'
    Value: !GetAtt SecretsManagerKMSKey.Arn
    Export:
      Name: !Sub '${AWS::StackName}-SecretsManagerKMSKeyArn'

  ClientCredentialsExample:
    Description: 'Example curl command for getting access token'
    Value: !Sub |
      # Get Gateway Client Secret from AWS Console or CLI:
      # aws cognito-idp describe-user-pool-client --user-pool-id ${M2MUserPool} --client-id ${GatewayClient}

      # Get access token using client credentials:
      curl -X POST https://${M2MUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/token \
        -H "Content-Type: application/x-www-form-urlencoded" \
        -d "grant_type=client_credentials&client_id=${GatewayClient}&client_secret=YOUR_CLIENT_SECRET&scope=${AWS::StackName}-resource-server/read ${AWS::StackName}-resource-server/gateway"