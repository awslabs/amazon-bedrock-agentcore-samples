  <title>Amazon Bedrock AgentCore - Smart Home</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: 
        radial-gradient(ellipse at 20% 20%, rgba(26, 35, 50, 0.8) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(18, 20, 26, 0.6) 0%, transparent 50%),
        linear-gradient(180deg, #0a0a0f 0%, #000000 100%);
      background-size: 100% 100%;
      background-attachment: fixed;
      min-height: 100vh;
    }

    /* Global scrollbar hiding for all elements */
    * {
      /* Hide scrollbar for WebKit browsers (Chrome, Safari, Edge) */
      scrollbar-width: none;
      /* Firefox */
      -ms-overflow-style: none;
      /* Internet Explorer 10+ */
    }

    *::-webkit-scrollbar {
      display: none;
      /* WebKit browsers */
    }

    /* Ensure smooth scrolling globally */
    html {
      scroll-behavior: smooth;
    }

    /* Specific body and html scrollbar hiding */
    html,
    body {
      scrollbar-width: none;
      /* Firefox */
      -ms-overflow-style: none;
      /* Internet Explorer 10+ */
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
      /* WebKit browsers */
    }
  </style>
</head>
