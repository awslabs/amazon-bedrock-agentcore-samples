[project]
name = "infra"
version = "0.1.0"
description = "CDK infrastructure for Marketing Research Agent"
requires-python = ">=3.13"
dependencies = [
    "aws-cdk-lib==2.217.0",
    "constructs>=10.0.0,<11.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]