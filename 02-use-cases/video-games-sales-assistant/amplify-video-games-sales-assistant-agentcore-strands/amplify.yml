version: 1
applications:
  - appRoot: 02-use-cases/video-games-sales-assistant/amplify-video-games-sales-assistant-agentcore-strands
    backend:
      phases:
        build:
          commands:
            - nvm install 22
            - nvm use 22
            - corepack enable
            - corepack prepare pnpm@latest --activate
            - pnpm install
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - corepack enable
            - corepack prepare pnpm@latest --activate
            - pnpm install
        build:
          commands:
            - export NEXT_TELEMETRY_DISABLED=1
            - export NODE_OPTIONS="--max-old-space-size=4096"
            - pnpm build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - .pnpm-store/**/*