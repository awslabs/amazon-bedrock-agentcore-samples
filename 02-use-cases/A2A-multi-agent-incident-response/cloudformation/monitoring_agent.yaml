  # IAM Role for Monitoring Tools Lambda
  MonitoringToolsLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CloudWatchAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListDashboards
                  - cloudwatch:GetDashboard
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:FilterLogEvents
                  - logs:GetLogEvents
                Resource: '*'
        - PolicyName: STSAssumeRole
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-MonitoringTools-Lambda-Role'

  # Lambda Function for Monitoring Tools
  MonitoringToolsLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-monitoring-tools'
      Runtime: python3.13
      Handler: index.lambda_handler
      Role: !GetAtt MonitoringToolsLambdaRole.Arn
      Timeout: 300
      MemorySize: 512
      Layers:
        - arn:aws:lambda:us-west-2:336392948345:layer:AWSSDKPandas-Python313:4
      Code:
        ZipFile: |
          import json
          import os
          import boto3
          import logging
          import requests
          from datetime import datetime, timedelta, timezone
          from typing import Optional

          # Configure logging
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def lambda_handler(event, context):
              """
              Lambda handler for AgentCore Gateway monitoring tools
              """
              try:
                  # Extract tool information from context
                  tool_name = context.client_context.custom['bedrockAgentCoreToolName']
                  logger.info(f"Original toolName: {tool_name}")

                  # Handle tool name with delimiter (if present)
                  delimiter = "___"
                  if delimiter in tool_name:
                      tool_name = tool_name[tool_name.index(delimiter) + len(delimiter):]
                  logger.info(f"Converted toolName: {tool_name}")

                  # Route to appropriate monitoring function
                  if tool_name == 'list_cloudwatch_dashboards':
                      return handle_list_dashboards(event)
                  elif tool_name == 'fetch_cloudwatch_logs_for_service':
                      return handle_fetch_logs(event)
                  elif tool_name == 'get_cloudwatch_alarms_for_service':
                      return handle_get_alarms(event)
                  elif tool_name == 'list_log_groups':
                      return handle_list_log_groups(event)
                  elif tool_name == 'analyze_log_group':
                      return handle_analyze_log_group(event)
                  elif tool_name == 'get_dashboard_summary':
                      return handle_get_dashboard_summary(event)
                  elif tool_name == 'get_log_streams':
                      return handle_get_log_streams(event)
                  elif tool_name == 'get_metric_statistics':
                      return handle_get_metric_statistics(event)
                  elif tool_name == 'get_alarm_history':
                      return handle_get_alarm_history(event)
                  elif tool_name == 'filter_log_events':
                      return handle_filter_log_events(event)
                  elif tool_name == 'list_metrics':
                      return handle_list_metrics(event)
                  else:
                      return {
                          'statusCode': 400,
                          'body': json.dumps({'error': f'Unknown tool: {tool_name}'})
                      }

              except Exception as e:
                  logger.error(f"Error in lambda_handler: {str(e)}", exc_info=True)
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': str(e)})
                  }

          def get_cross_account_client(service_name: str, account_id: Optional[str] = None, role_name: Optional[str] = None):
              """
              Get boto3 client with cross-account access if credentials provided
              """
              if account_id and role_name:
                  sts_client = boto3.client('sts')
                  role_arn = f"arn:aws:iam::{account_id}:role/{role_name}"

                  assumed_role = sts_client.assume_role(
                      RoleArn=role_arn,
                      RoleSessionName='MonitoringToolsSession'
                  )

                  credentials = assumed_role['Credentials']
                  return boto3.client(
                      service_name,
                      aws_access_key_id=credentials['AccessKeyId'],
                      aws_secret_access_key=credentials['SecretAccessKey'],
                      aws_session_token=credentials['SessionToken']
                  )
              else:
                  return boto3.client(service_name)

          def handle_list_dashboards(event):
              """List all CloudWatch dashboards"""
              try:
                  account_id = event.get('accountId')
                  role_name = event.get('roleName')

                  cloudwatch = get_cross_account_client('cloudwatch', account_id, role_name)

                  dashboards = []
                  paginator = cloudwatch.get_paginator('list_dashboards')

                  for page in paginator.paginate():
                      dashboards.extend(page['DashboardEntries'])

                  return {
                      'statusCode': 200,
                      'body': json.dumps({
                          'dashboards': dashboards,
                          'count': len(dashboards)
                      })
                  }
              except Exception as e:
                  logger.error(f"Error listing dashboards: {str(e)}", exc_info=True)
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': str(e)})
                  }

          def handle_fetch_logs(event):
              """Fetch CloudWatch logs for a service with time filtering and error analysis"""
              try:
                  service_name = event.get('serviceName')
                  account_id = event.get('accountId')
                  role_name = event.get('roleName')
                  time_range_minutes = event.get('timeRangeMinutes', 60)
                  max_logs = event.get('maxLogs', 100)

                  if not service_name:
                      return {
                          'statusCode': 400,
                          'body': json.dumps({'error': 'serviceName is required'})
                      }

                  logs_client = get_cross_account_client('logs', account_id, role_name)

                  # Find log groups for the service (try multiple patterns)
                  log_groups = []
                  search_patterns = [
                      f'/aws/{service_name}',
                      f'/{service_name}',
                      service_name
                  ]

                  for pattern in search_patterns:
                      try:
                          paginator = logs_client.get_paginator('describe_log_groups')
                          for page in paginator.paginate(logGroupNamePrefix=pattern):
                              log_groups.extend(page['logGroups'])
                          if log_groups:
                              break
                      except Exception as e:
                          logger.debug(f"No log groups found with pattern {pattern}: {str(e)}")
                          continue

                  if not log_groups:
                      return {
                          'statusCode': 404,
                          'body': json.dumps({
                              'message': f'No log groups found for service: {service_name}',
                              'searchedPatterns': search_patterns
                          })
                      }

                  # Calculate time range
                  end_time = int(datetime.now(timezone.utc).timestamp() * 1000)
                  start_time = int((datetime.now(timezone.utc) - timedelta(minutes=time_range_minutes)).timestamp() * 1000)

                  # Collect logs from multiple log groups (up to 3)
                  all_logs = []
                  error_count = 0
                  warning_count = 0
                  log_groups_processed = []

                  for log_group in log_groups[:3]:
                      log_group_name = log_group['logGroupName']
                      log_groups_processed.append(log_group_name)

                      try:
                          # Get recent log streams
                          streams_response = logs_client.describe_log_streams(
                              logGroupName=log_group_name,
                              orderBy='LastEventTime',
                              descending=True,
                              limit=5
                          )

                          for stream in streams_response.get('logStreams', []):
                              try:
                                  events_response = logs_client.get_log_events(
                                      logGroupName=log_group_name,
                                      logStreamName=stream['logStreamName'],
                                      startTime=start_time,
                                      endTime=end_time,
                                      limit=50
                                  )

                                  for event in events_response.get('events', []):
                                      message = event.get('message', '')
                                      message_lower = message.lower()

                                      # Count errors and warnings
                                      if 'error' in message_lower or 'exception' in message_lower or 'fatal' in message_lower:
                                          error_count += 1
                                      if 'warn' in message_lower or 'warning' in message_lower:
                                          warning_count += 1

                                      all_logs.append({
                                          'timestamp': event.get('timestamp'),
                                          'message': message,
                                          'logGroup': log_group_name,
                                          'stream': stream['logStreamName']
                                          })
                              except Exception as e:
                                  logger.warning(f"Error fetching events from stream: {str(e)}")
                                  continue

                      except Exception as e:
                          logger.warning(f"Error processing log group {log_group_name}: {str(e)}")
                          continue

                  # Sort by timestamp (most recent first)
                  all_logs.sort(key=lambda x: x['timestamp'], reverse=True)
                  all_logs = all_logs[:max_logs]

                  return {
                      'statusCode': 200,
                      'body': json.dumps({
                          'serviceName': service_name,
                          'logGroupsFound': len(log_groups),
                          'logGroupsProcessed': log_groups_processed,
                          'timeRangeMinutes': time_range_minutes,
                          'analysis': {
                              'totalLogs': len(all_logs),
                              'errorCount': error_count,
                              'warningCount': warning_count
                          },
                          'logs': all_logs
                      })
                  }

              except Exception as e:
                  logger.error(f"Error fetching logs: {str(e)}", exc_info=True)
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': str(e)})
                  }

          def handle_get_alarms(event):
              """Get CloudWatch alarms for a service with state filtering and analysis"""
              try:
                  service_name = event.get('serviceName')
                  account_id = event.get('accountId')
                  role_name = event.get('roleName')
                  alarm_state = event.get('alarmState')  # Optional: ALARM, OK, INSUFFICIENT_DATA

                  cloudwatch = get_cross_account_client('cloudwatch', account_id, role_name)

                  alarms = []
                  paginator = cloudwatch.get_paginator('describe_alarms')

                  # Build pagination parameters
                  paginate_params = {}
                  if alarm_state:
                      paginate_params['StateValue'] = alarm_state

                  # Collect all alarms
                  for page in paginator.paginate(**paginate_params):
                      alarms.extend(page.get('MetricAlarms', []))

                  # Filter by service name if provided
                  if service_name:
                      filtered_alarms = []
                      service_lower = service_name.lower()

                      for alarm in alarms:
                          alarm_name = alarm.get('AlarmName', '').lower()
                          alarm_namespace = alarm.get('Namespace', '').lower()
                          alarm_dimensions = alarm.get('Dimensions', [])

                          # Check if service name matches alarm name, namespace, or dimensions
                          if (service_lower in alarm_name or
                              service_lower in alarm_namespace or
                              any(service_lower in str(dim.get('Value', '')).lower() for dim in alarm_dimensions)):
                              filtered_alarms.append(alarm)

                      alarms = filtered_alarms

                  # Categorize alarms by state
                  alarm_states = {
                      'ALARM': [],
                      'OK': [],
                      'INSUFFICIENT_DATA': []
                  }

                  for alarm in alarms:
                      state = alarm.get('StateValue', 'UNKNOWN')
                      if state in alarm_states:
                          alarm_states[state].append({
                              'name': alarm.get('AlarmName'),
                              'description': alarm.get('AlarmDescription'),
                              'reason': alarm.get('StateReason'),
                              'namespace': alarm.get('Namespace'),
                              'metricName': alarm.get('MetricName'),
                              'threshold': alarm.get('Threshold'),
                              'comparisonOperator': alarm.get('ComparisonOperator'),
                              'stateUpdatedTimestamp': alarm.get('StateUpdatedTimestamp'),
                              'actionsEnabled': alarm.get('ActionsEnabled'),
                              'alarmActions': alarm.get('AlarmActions', [])
                          })

                  return {
                      'statusCode': 200,
                      'body': json.dumps({
                          'serviceName': service_name,
                          'summary': {
                              'total': len(alarms),
                              'inAlarmState': len(alarm_states['ALARM']),
                              'okState': len(alarm_states['OK']),
                              'insufficientDataState': len(alarm_states['INSUFFICIENT_DATA'])
                          },
                          'alarmsByState': alarm_states,
                          'allAlarms': alarms
                      })
                  }
              except Exception as e:
                  logger.error(f"Error getting alarms: {str(e)}", exc_info=True)
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': str(e)})
                  }

          def handle_list_log_groups(event):
              """List all log groups"""
              try:
                  account_id = event.get('accountId')
                  role_name = event.get('roleName')

                  logs_client = get_cross_account_client('logs', account_id, role_name)

                  log_groups = []
                  paginator = logs_client.get_paginator('describe_log_groups')

                  for page in paginator.paginate():
                      log_groups.extend(page['logGroups'])

                  return {
                      'statusCode': 200,
                      'body': json.dumps({
                          'logGroups': [lg['logGroupName'] for lg in log_groups],
                          'count': len(log_groups)
                      })
                  }
              except Exception as e:
                  logger.error(f"Error listing log groups: {str(e)}", exc_info=True)
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': str(e)})
                  }

          def handle_analyze_log_group(event):
              """Analyze a specific log group with detailed metrics and recent logs"""
              try:
                  log_group_name = event.get('logGroupName')
                  account_id = event.get('accountId')
                  role_name = event.get('roleName')
                  time_range_minutes = event.get('timeRangeMinutes', 60)  # Default to last hour
                  max_logs = event.get('maxLogs', 100)

                  if not log_group_name:
                      return {
                          'statusCode': 400,
                          'body': json.dumps({'error': 'logGroupName is required'})
                      }

                  logs_client = get_cross_account_client('logs', account_id, role_name)

                  # Get log group details
                  try:
                      log_groups_response = logs_client.describe_log_groups(
                          logGroupNamePrefix=log_group_name,
                          limit=1
                      )
                      log_groups = log_groups_response.get('logGroups', [])

                      if not log_groups:
                          return {
                              'statusCode': 404,
                              'body': json.dumps({'error': f'Log group not found: {log_group_name}'})
                          }

                      log_group_info = log_groups[0]
                  except Exception as e:
                      logger.error(f"Error describing log group: {str(e)}")
                      return {
                          'statusCode': 404,
                          'body': json.dumps({'error': f'Log group not found or inaccessible: {log_group_name}'})
                      }

                  # Get recent log streams (last 10 active streams)
                  try:
                      streams_response = logs_client.describe_log_streams(
                          logGroupName=log_group_name,
                          orderBy='LastEventTime',
                          descending=True,
                          limit=10
                      )
                      log_streams = streams_response.get('logStreams', [])
                  except Exception as e:
                      logger.error(f"Error describing log streams: {str(e)}")
                      log_streams = []

                  # Get recent log events from the most active streams
                  recent_logs = []
                  error_count = 0
                  warning_count = 0

                  if log_streams:
                      # Calculate time range
                      end_time = int(datetime.now(timezone.utc).timestamp() * 1000)
                      start_time = int((datetime.now(timezone.utc) - timedelta(minutes=time_range_minutes)).timestamp() * 1000)

                      for stream in log_streams[:5]:  # Get logs from top 5 most recent streams
                          try:
                              events_response = logs_client.get_log_events(
                                  logGroupName=log_group_name,
                                  logStreamName=stream['logStreamName'],
                                  startTime=start_time,
                                  endTime=end_time,
                                  limit=max_logs // 5  # Distribute log limit across streams
                              )

                              for event in events_response.get('events', []):
                                  message = event.get('message', '')
                                  # Count errors and warnings
                                  message_lower = message.lower()
                                  if 'error' in message_lower or 'exception' in message_lower or 'fatal' in message_lower:
                                      error_count += 1
                                  if 'warn' in message_lower or 'warning' in message_lower:
                                      warning_count += 1

                                  recent_logs.append({
                                      'timestamp': event.get('timestamp'),
                                      'message': message,
                                      'stream': stream['logStreamName']
                                  })
                          except Exception as e:
                              logger.warning(f"Error fetching logs from stream {stream['logStreamName']}: {str(e)}")
                              continue

                  # Sort logs by timestamp (most recent first)
                  recent_logs.sort(key=lambda x: x['timestamp'], reverse=True)
                  recent_logs = recent_logs[:max_logs]  # Limit to max_logs

                  return {
                      'statusCode': 200,
                      'body': json.dumps({
                          'logGroup': {
                              'name': log_group_info.get('logGroupName'),
                              'arn': log_group_info.get('arn'),
                              'creationTime': log_group_info.get('creationTime'),
                              'storedBytes': log_group_info.get('storedBytes'),
                              'retentionInDays': log_group_info.get('retentionInDays'),
                          },
                          'streams': {
                              'count': len(log_streams),
                              'recentStreams': [s['logStreamName'] for s in log_streams[:10]]
                          },
                          'analysis': {
                              'timeRangeMinutes': time_range_minutes,
                              'totalLogs': len(recent_logs),
                              'errorCount': error_count,
                              'warningCount': warning_count
                          },
                          'recentLogs': recent_logs
                      })
                  }
              except Exception as e:
                  logger.error(f"Error analyzing log group: {str(e)}", exc_info=True)
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': str(e)})
                  }

          def handle_get_dashboard_summary(event):
              """Get dashboard summary with parsed widgets"""
              try:
                  dashboard_name = event.get('dashboardName')
                  account_id = event.get('accountId')
                  role_name = event.get('roleName')

                  if not dashboard_name:
                      return {
                          'statusCode': 400,
                          'body': json.dumps({'error': 'dashboardName is required'})
                      }

                  cloudwatch = get_cross_account_client('cloudwatch', account_id, role_name)

                  dashboard = cloudwatch.get_dashboard(DashboardName=dashboard_name)

                  # Parse dashboard body
                  dashboard_body = json.loads(dashboard.get('DashboardBody', '{}'))
                  widgets = dashboard_body.get('widgets', [])

                  # Extract widget information
                  widget_summary = []
                  for widget in widgets:
                      properties = widget.get('properties', {})
                      widget_summary.append({
                          'type': widget.get('type'),
                          'title': properties.get('title'),
                          'metrics': properties.get('metrics', []),
                          'region': properties.get('region')
                      })

                  return {
                      'statusCode': 200,
                      'body': json.dumps({
                          'dashboardName': dashboard_name,
                          'dashboardArn': dashboard.get('DashboardArn'),
                          'widgetCount': len(widgets),
                          'widgets': widget_summary,
                          'fullDashboard': dashboard
                      })
                  }
              except Exception as e:
                  logger.error(f"Error getting dashboard summary: {str(e)}", exc_info=True)
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': str(e)})
                  }

          def handle_get_log_streams(event):
              """Get log streams for a specific log group"""
              try:
                  log_group_name = event.get('logGroupName')
                  account_id = event.get('accountId')
                  role_name = event.get('roleName')
                  limit = event.get('limit', 50)
                  order_by = event.get('orderBy', 'LastEventTime')  # LastEventTime or LogStreamName

                  if not log_group_name:
                      return {
                          'statusCode': 400,
                          'body': json.dumps({'error': 'logGroupName is required'})
                      }

                  logs_client = get_cross_account_client('logs', account_id, role_name)

                  # Get log streams
                  streams_response = logs_client.describe_log_streams(
                      logGroupName=log_group_name,
                      orderBy=order_by,
                      descending=True,
                      limit=min(limit, 50)  # AWS limit is 50
                  )

                  streams = streams_response.get('logStreams', [])

                  # Format stream information
                  stream_info = []
                  for stream in streams:
                      stream_info.append({
                          'name': stream.get('logStreamName'),
                          'creationTime': stream.get('creationTime'),
                          'firstEventTimestamp': stream.get('firstEventTimestamp'),
                          'lastEventTimestamp': stream.get('lastEventTimestamp'),
                          'lastIngestionTime': stream.get('lastIngestionTime'),
                          'uploadSequenceToken': stream.get('uploadSequenceToken'),
                          'storedBytes': stream.get('storedBytes')
                      })

                  return {
                      'statusCode': 200,
                      'body': json.dumps({
                          'logGroupName': log_group_name,
                          'streamCount': len(streams),
                          'streams': stream_info
                      })
                  }
              except Exception as e:
                  logger.error(f"Error getting log streams: {str(e)}", exc_info=True)
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': str(e)})
                  }

          def handle_get_metric_statistics(event):
              """Get CloudWatch metric statistics"""
              try:
                  namespace = event.get('namespace')
                  metric_name = event.get('metricName')
                  dimensions = event.get('dimensions', [])
                  start_time_minutes = event.get('startTimeMinutes', 60)
                  period = event.get('period', 300)  # 5 minutes default
                  statistics = event.get('statistics', ['Average', 'Sum', 'Minimum', 'Maximum'])
                  account_id = event.get('accountId')
                  role_name = event.get('roleName')

                  if not namespace or not metric_name:
                      return {
                          'statusCode': 400,
                          'body': json.dumps({'error': 'namespace and metricName are required'})
                      }

                  cloudwatch = get_cross_account_client('cloudwatch', account_id, role_name)

                  # Calculate time range
                  end_time = datetime.now(timezone.utc)
                  start_time = end_time - timedelta(minutes=start_time_minutes)

                  # Get metric statistics
                  response = cloudwatch.get_metric_statistics(
                      Namespace=namespace,
                      MetricName=metric_name,
                      Dimensions=dimensions,
                      StartTime=start_time,
                      EndTime=end_time,
                      Period=period,
                      Statistics=statistics
                  )

                  datapoints = response.get('Datapoints', [])

                  # Sort by timestamp
                  datapoints.sort(key=lambda x: x['Timestamp'], reverse=True)

                  return {
                      'statusCode': 200,
                      'body': json.dumps({
                          'namespace': namespace,
                          'metricName': metric_name,
                          'dimensions': dimensions,
                          'period': period,
                          'startTime': start_time.isoformat(),
                          'endTime': end_time.isoformat(),
                          'datapointCount': len(datapoints),
                          'datapoints': datapoints,
                          'label': response.get('Label')
                      }, default=str)
                  }
              except Exception as e:
                  logger.error(f"Error getting metric statistics: {str(e)}", exc_info=True)
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': str(e)})
                  }

          def handle_get_alarm_history(event):
              """Get CloudWatch alarm history"""
              try:
                  alarm_name = event.get('alarmName')
                  history_item_type = event.get('historyItemType')  # ConfigurationUpdate, StateUpdate, Action
                  start_time_hours = event.get('startTimeHours', 24)
                  max_records = event.get('maxRecords', 100)
                  account_id = event.get('accountId')
                  role_name = event.get('roleName')

                  if not alarm_name:
                      return {
                          'statusCode': 400,
                          'body': json.dumps({'error': 'alarmName is required'})
                      }

                  cloudwatch = get_cross_account_client('cloudwatch', account_id, role_name)

                  # Calculate time range
                  end_time = datetime.now(timezone.utc)
                  start_time = end_time - timedelta(hours=start_time_hours)

                  # Build request parameters
                  params = {
                      'AlarmName': alarm_name,
                      'StartDate': start_time,
                      'EndDate': end_time,
                      'MaxRecords': min(max_records, 100)
                  }

                  if history_item_type:
                      params['HistoryItemType'] = history_item_type

                  # Get alarm history
                  response = cloudwatch.describe_alarm_history(**params)

                  history_items = response.get('AlarmHistoryItems', [])

                  # Format history items
                  formatted_history = []
                  for item in history_items:
                      formatted_history.append({
                          'timestamp': item.get('Timestamp'),
                          'historyItemType': item.get('HistoryItemType'),
                          'historySummary': item.get('HistorySummary'),
                          'historyData': item.get('HistoryData')
                      })

                  return {
                      'statusCode': 200,
                      'body': json.dumps({
                          'alarmName': alarm_name,
                          'historyItemCount': len(history_items),
                          'historyItems': formatted_history
                      }, default=str)
                  }
              except Exception as e:
                  logger.error(f"Error getting alarm history: {str(e)}", exc_info=True)
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': str(e)})
                  }

          def handle_filter_log_events(event):
              """Filter log events using pattern matching"""
              try:
                  log_group_name = event.get('logGroupName')
                  filter_pattern = event.get('filterPattern', '')
                  log_stream_names = event.get('logStreamNames', [])
                  start_time_minutes = event.get('startTimeMinutes', 60)
                  limit = event.get('limit', 100)
                  account_id = event.get('accountId')
                  role_name = event.get('roleName')

                  if not log_group_name:
                      return {
                          'statusCode': 400,
                          'body': json.dumps({'error': 'logGroupName is required'})
                      }

                  logs_client = get_cross_account_client('logs', account_id, role_name)

                  # Calculate time range
                  end_time = int(datetime.now(timezone.utc).timestamp() * 1000)
                  start_time = int((datetime.now(timezone.utc) - timedelta(minutes=start_time_minutes)).timestamp() * 1000)

                  # Build request parameters
                  params = {
                      'logGroupName': log_group_name,
                      'startTime': start_time,
                      'endTime': end_time,
                      'limit': min(limit, 10000)
                  }

                  if filter_pattern:
                      params['filterPattern'] = filter_pattern

                  if log_stream_names:
                      params['logStreamNames'] = log_stream_names

                  # Filter log events
                  response = logs_client.filter_log_events(**params)

                  events = response.get('events', [])

                  # Count errors and warnings
                  error_count = 0
                  warning_count = 0

                  for event_item in events:
                      message = event_item.get('message', '').lower()
                      if 'error' in message or 'exception' in message or 'fatal' in message:
                          error_count += 1
                      if 'warn' in message or 'warning' in message:
                          warning_count += 1

                  return {
                      'statusCode': 200,
                      'body': json.dumps({
                          'logGroupName': log_group_name,
                          'filterPattern': filter_pattern,
                          'eventCount': len(events),
                          'analysis': {
                              'errorCount': error_count,
                              'warningCount': warning_count
                          },
                          'events': events
                      })
                  }
              except Exception as e:
                  logger.error(f"Error filtering log events: {str(e)}", exc_info=True)
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': str(e)})
                  }

          def handle_list_metrics(event):
              """List available CloudWatch metrics"""
              try:
                  namespace = event.get('namespace')
                  metric_name = event.get('metricName')
                  dimensions = event.get('dimensions', [])
                  account_id = event.get('accountId')
                  role_name = event.get('roleName')

                  cloudwatch = get_cross_account_client('cloudwatch', account_id, role_name)

                  # Build request parameters
                  params = {}
                  if namespace:
                      params['Namespace'] = namespace
                  if metric_name:
                      params['MetricName'] = metric_name
                  if dimensions:
                      params['Dimensions'] = dimensions

                  # List metrics
                  metrics = []
                  paginator = cloudwatch.get_paginator('list_metrics')

                  for page in paginator.paginate(**params):
                      metrics.extend(page.get('Metrics', []))

                  # Group metrics by namespace
                  metrics_by_namespace = {}
                  for metric in metrics:
                      ns = metric.get('Namespace', 'Unknown')
                      if ns not in metrics_by_namespace:
                          metrics_by_namespace[ns] = []
                      metrics_by_namespace[ns].append({
                          'metricName': metric.get('MetricName'),
                          'dimensions': metric.get('Dimensions', [])
                      })

                  return {
                      'statusCode': 200,
                      'body': json.dumps({
                          'totalMetrics': len(metrics),
                          'namespaceCount': len(metrics_by_namespace),
                          'metricsByNamespace': metrics_by_namespace,
                          'allMetrics': metrics
                      })
                  }
              except Exception as e:
                  logger.error(f"Error listing metrics: {str(e)}", exc_info=True)
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': str(e)})
                  }
