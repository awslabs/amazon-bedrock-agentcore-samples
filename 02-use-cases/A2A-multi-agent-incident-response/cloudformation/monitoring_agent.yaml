                      roleName:
                        Type: string
                        Description: IAM role name for cross-account access
                - Name: fetch_cloudwatch_logs_for_service
                  Description: Fetch recent CloudWatch logs for a specific AWS service with time filtering, error analysis, and counts. Searches multiple log group patterns and returns logs with error/warning counts.
                  InputSchema:
                    Type: object
                    Properties:
                      serviceName:
                        Type: string
                        Description: Name of the AWS service (e.g., lambda, ec2, rds, eks, etc.)
                      timeRangeMinutes:
                        Type: number
                        Description: Time range in minutes to fetch logs (default 60 minutes)
                      maxLogs:
                        Type: number
                        Description: Maximum number of log entries to return (default 100)
                      accountId:
                        Type: string
                        Description: AWS account ID for cross-account access
