                  InputSchema:
                    Type: object
                    Properties:
                      serviceName:
                        Type: string
                        Description: Name of the AWS service to get alarms for
                      alarmState:
                        Type: string
                        Description: Optional filter by alarm state (ALARM, OK, or INSUFFICIENT_DATA)
                      accountId:
                        Type: string
                        Description: AWS account ID for cross-account access
                      roleName:
                        Type: string
                        Description: IAM role name for cross-account access
                    Required:
                      - serviceName
                - Name: list_log_groups
                  Description: List all CloudWatch log groups
                  InputSchema:
                    Type: object
                    Properties:
                      accountId:
                        Type: string
                        Description: AWS account ID for cross-account access
                      roleName:
                        Type: string
                        Description: IAM role name for cross-account access
                - Name: analyze_log_group
                  Description: Analyze a specific CloudWatch log group with detailed metrics, recent logs, error counts, and warning counts from recent log streams
                  InputSchema:
                    Type: object
                    Properties:
                      logGroupName:
                        Type: string
                        Description: Name of the log group to analyze
                      timeRangeMinutes:
                        Type: number
                        Description: Time range in minutes to analyze logs (default 60 minutes)
                      maxLogs:
                        Type: number
                        Description: Maximum number of log entries to return (default 100)
                      accountId:
                        Type: string
                        Description: AWS account ID for cross-account access
                      roleName:
                        Type: string
                        Description: IAM role name for cross-account access
                    Required:
                      - logGroupName
                - Name: get_dashboard_summary
                  Description: Get summary of a CloudWatch dashboard with parsed widget information
                  InputSchema:
                    Type: object
                    Properties:
                      dashboardName:
                        Type: string
                        Description: Name of the dashboard
                      accountId:
                        Type: string
                        Description: AWS account ID for cross-account access
                      roleName:
                        Type: string
                        Description: IAM role name for cross-account access
                    Required:
                      - dashboardName
                - Name: get_log_streams
                  Description: Get log streams for a specific log group with ordering and metadata
                  InputSchema:
                    Type: object
                    Properties:
                      logGroupName:
                        Type: string
                        Description: Name of the log group to get streams for
                      limit:
                        Type: number
                        Description: Maximum number of log streams to return (default 50, max 50)
                      orderBy:
                        Type: string
                        Description: How to order the log streams (LastEventTime or LogStreamName, default LastEventTime)
                      accountId:
                        Type: string
                        Description: AWS account ID for cross-account access
                      roleName:
                        Type: string
                        Description: IAM role name for cross-account access
                    Required:
                      - logGroupName
                - Name: get_metric_statistics
                  Description: Get CloudWatch metric statistics over a time range with various statistical measures (Average, Sum, Min, Max)
                  InputSchema:
                    Type: object
                    Properties:
                      namespace:
                        Type: string
                        Description: CloudWatch namespace (e.g., AWS/EC2, AWS/Lambda, AWS/RDS)
                      metricName:
                        Type: string
                        Description: Name of the metric (e.g., CPUUtilization, NetworkIn, Duration)
                      dimensions:
                        Type: array
                        Description: Array of dimension objects with Name and Value properties to filter the metric
                      startTimeMinutes:
                        Type: number
                        Description: How many minutes back to start the time range (default 60)
                      period:
                        Type: number
                        Description: The granularity in seconds of the returned datapoints (default 300, i.e., 5 minutes)
                      statistics:
                        Type: array
