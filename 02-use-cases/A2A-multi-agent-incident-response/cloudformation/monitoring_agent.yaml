                  InputSchema:
                    Type: object
                    Properties:
                      logGroupName:
                        Type: string
                        Description: Name of the log group to filter
                      filterPattern:
                        Type: string
                        Description: CloudWatch Logs filter pattern (e.g., '[ERROR]', '[time, request_id, level = ERROR]')
                      logStreamNames:
                        Type: array
