otel-trace-pipeline:
  source:
    otel_trace_source:
      port: 21890
      ssl: false
  sink:
    - opensearch:
        hosts: ["http://opensearch:9200"]
        index_type: trace-analytics-raw
    - opensearch:
        hosts: ["http://opensearch:9200"]
        index_type: trace-analytics-service-map

otel-metrics-pipeline:
  source:
    otel_metrics_source:
      port: 21891
      ssl: false
  processor:
    - otel_metrics:
  sink:
    - opensearch:
        hosts: ["http://opensearch:9200"]
        index: otel-metrics
